<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Sultan WiFi</title>
  <style>
    body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .card { background: #1e293b; padding: 2rem; border-radius: 1rem; max-width: 400px; border: 1px solid #334155; }
    h1 { color: #f43f5e; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; }
    button { margin-top: 1rem; padding: 0.6rem 1.2rem; background: #06b6d4; border: none; color: white; font-weight: bold; border-radius: 0.5rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Koneksi Terputus</h1>
    <p>Aplikasi Sultan WiFi tidak dapat terhubung ke internet. Periksa koneksi kamu dan coba lagi.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
