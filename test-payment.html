<!-- test-payment.html -->
<!-- Simple test page untuk generate payment link -->
<!-- Buka file ini di browser setelah login ke dashboard -->
<!DOCTYPE html>
<html>
<head>
    <title>Test Payment Link Generation</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0051cc; }
        .result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; white-space: pre-wrap; word-break: break-all; }
        .error { background: #fee; color: #c00; }
        .success { background: #efe; color: #060; }
    </style>
</head>
<body>
    <h1>🧪 Test Payment Link Generation</h1>
    <p><strong>Tagihan ID:</strong> 175aba3f-255b-40d0-b2fd-729dd62a82f7</p>
    <p><strong>Pelanggan:</strong> Test Payment User (TEST-001)</p>
    <p><strong>Jumlah:</strong> Rp 100.000</p>
    
    <button onclick="generatePaymentLink()">💳 Generate Payment Link</button>
    
    <div id="result"></div>

    <script>
        async function generatePaymentLink() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">⏳ Generating payment link...</div>';
            
            try {
                const response = await fetch('https://beatnet.vercel.app/api/payment/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // Important for auth cookies
                    body: JSON.stringify({
                        tagihan_id: '175aba3f-255b-40d0-b2fd-729dd62a82f7'
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }

                if (data.sukses && data.payment_url) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <strong>✅ Payment Link Generated!</strong><br><br>
                            <strong>Payment URL:</strong><br>
                            <a href="${data.payment_url}" target="_blank" style="color: #0070f3; word-break: break-all;">${data.payment_url}</a><br><br>
                            <strong>Order ID:</strong> ${data.order_id}<br>
                            <strong>Reused:</strong> ${data.reused ? 'Yes (existing link)' : 'No (new link)'}<br><br>
                            <button onclick="window.open('${data.payment_url}', '_blank')" style="margin-top: 10px;">
                                🚀 Open Payment Page
                            </button>
                        </div>
                    `;
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ Error:</strong><br>
                        ${error.message}<br><br>
                        <strong>Note:</strong> Make sure you're logged in to the dashboard first!<br>
                        <a href="https://beatnet.vercel.app/dashboard" target="_blank">Login to Dashboard</a>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
